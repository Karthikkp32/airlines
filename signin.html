<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup & Login Page</title>
  <!-- Google Fonts for better typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px; /* spacing around the container */
    }
    /* Outer container to hold images and form */
    .outer-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    /* Left & Right columns for images */
    .left-images,
    .right-images {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      flex: 1; /* allows columns to expand/shrink */
    }
    .left-images img,
    .right-images img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }
    .left-images img:hover,
    .right-images img:hover {
      transform: scale(1.05);
    }
    /* Center column for the form */
    .form-box {
      width: 400px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      flex-shrink: 0; /* keep the form at a fixed width */
    }
    /* Form Header Tabs */
    .form-header {
      display: flex;
      background-color: #f2f2f2;
    }
    .form-header div {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: #555;
      transition: background-color 0.3s, color 0.3s;
    }
    .form-header .active {
      background-color: #5563DE;
      color: #fff;
    }
    .form-content {
      padding: 30px;
    }
    .form-content form {
      display: flex;
      flex-direction: column;
    }
    .form-content input,
    .form-content select {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      outline: none;
      transition: border 0.3s;
    }
    .form-content input:focus,
    .form-content select:focus {
      border-color: #5563DE;
    }
    button {
      padding: 12px;
      background-color: #5563DE;
      border: none;
      color: #fff;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #3b48b3;
    }
    .form-footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .form-footer a {
      color: #5563DE;
      text-decoration: none;
      font-weight: 600;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .social-icons a {
      color: #5563DE;
      font-size: 20px;
      margin: 0 10px;
      transition: transform 0.3s, color 0.3s;
    }
    .social-icons a:hover {
      transform: scale(1.2);
      color: #3b48b3;
    }
    .forgot-password {
      text-align: right;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .forgot-password a {
      color: #5563DE;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

  <script>
    // Toggle between Signup and Login forms
    const signupTab = document.getElementById('signupTab');
    const loginTab = document.getElementById('loginTab');
    const signupFormDiv = document.getElementById('signupForm');
    const loginFormDiv = document.getElementById('loginForm');
    const showLoginLink = document.getElementById('showLogin');
    const showSignupLink = document.getElementById('showSignup');
  
    function showSignup() {
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupFormDiv.style.display = 'block';
      loginFormDiv.style.display = 'none';
    }
  
    function showLogin() {
      signupTab.classList.remove('active');
      loginTab.classList.add('active');
      signupFormDiv.style.display = 'none';
      loginFormDiv.style.display = 'block';
    }
  
    signupTab.addEventListener('click', showSignup);
    loginTab.addEventListener('click', showLogin);
    showLoginLink.addEventListener('click', function(e) {
      e.preventDefault();
      showLogin();
    });
    showSignupLink.addEventListener('click', function(e) {
      e.preventDefault();
      showSignup();
    });
  
    // JavaScript for form functionality
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('role').value;
  
      if (!fullname || !email || !password || !role) {
        alert('Please fill in all fields.');
        return;
      }
  
      alert(`Signup Successful! Welcome, ${fullname} (${role}).`);
      this.reset();
  
      // Redirect to Login form after successful signup
      setTimeout(() => {
        showLogin();
      }, 1000); // Adjust delay as needed
    });
  
    document.getElementById('loginUserForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
  
      if (!email || !password) {
        alert('Please fill in all fields.');
        return;
      }
  
      alert(`Login Successful for ${email}!`);
      this.reset();
  
      // Redirect to dashboard page after successful login
      setTimeout(() => {
        window.location.href = 'dashboard.html'; // Change this URL as needed
      }, 1000); // Adjust delay as needed
    });
  </script>
